[project]
name = "vit-pytorch"
version = "0.1.0"
description = "Implementation of Vision Transformer, 'An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale', from Google Brain."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
